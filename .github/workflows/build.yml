name: Build OpenWrt packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.release }} / ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: "25.12", tag: "x86_64-openwrt-25.12" }
          - { release: "25.12", tag: "bcm27xx-bcm2711-openwrt-25.12" }
          - { release: "25.12", tag: "mediatek-mt7622-openwrt-25.12" }
          - { release: "25.12", tag: "ramips-mt7621-openwrt-25.12" }
          - { release: "snapshot", tag: "x86_64-25.12-SNAPSHOT" }
          - { release: "snapshot", tag: "mediatek-mt7622-25.12-SNAPSHOT" }
          - { release: "24.10", tag: "x86_64-openwrt-24.10" }
    steps:
      - uses: actions/checkout@v4

      - name: Build package in SDK
        run: |
          IMAGE="openwrt/sdk:${{ matrix.tag }}"
          echo "Using SDK image: $IMAGE"
          docker run --rm -v "$PWD:/work" "$IMAGE" /bin/sh -c '
            set -e
            cd /builder
            cp -r /work/package/udp-broadcast-relay-redux package/
            make package/udp-broadcast-relay-redux/compile -j$(nproc) || make package/udp-broadcast-relay-redux/compile V=s
            find bin -name "udp-broadcast-relay-redux*" -exec cp {} /work/ \;
          '

      - name: Collect
        run: |
          mkdir -p artifacts
          for f in udp-broadcast-relay-redux*; do
            [ -f "$f" ] && mv "$f" "artifacts/${{ matrix.release }}-$(echo ${{ matrix.target }} | tr / -)-$f"
          done
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.release }}-${{ matrix.tag }}
          path: artifacts/*

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
