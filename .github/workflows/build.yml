name: Build OpenWrt packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64-openwrt-25.12
          - x86_64-openwrt-24.10
          - x86_64-25.12-SNAPSHOT
          - bcm27xx-bcm2711-openwrt-25.12
          - mediatek-mt7622-openwrt-25.12
          - mediatek-mt7622-25.12-SNAPSHOT
          - ramips-mt7621-openwrt-25.12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        uses: openwrt/gh-action-sdk@v7
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGES: udp-broadcast-relay-redux
          FEEDNAME: packages_link
          NO_REFRESH_CHECK: 1
          V: s

      - name: Collect packages
        run: |
          mkdir -p artifacts
          find bin/packages -name 'udp-broadcast-relay-redux*.apk' -o -name 'udp-broadcast-relay-redux*.ipk' 2>/dev/null | while read f; do
            cp "$f" artifacts/
          done
          ls -la artifacts/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.arch }}
          path: artifacts/*

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
