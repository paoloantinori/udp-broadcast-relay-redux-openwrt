name: Build OpenWrt packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.release }} / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: "24.10", sdk: "24.10", target: "x86/64", subtarget: "generic" }
          - { release: "25.12", sdk: "25.12", target: "x86/64", subtarget: "generic" }
          - { release: "snapshot", sdk: "snapshots", target: "x86/64", subtarget: "generic" }
          - { release: "25.12", sdk: "25.12", target: "bcm2711", subtarget: "generic" }
          - { release: "25.12", sdk: "25.12", target: "mediatek/mt7622", subtarget: "generic" }
          - { release: "25.12", sdk: "25.12", target: "ramips/mt7621", subtarget: "generic" }
          - { release: "snapshot", sdk: "snapshots", target: "mediatek/mt7622", subtarget: "generic" }
    steps:
      - uses: actions/checkout@v4

      - name: Build package in SDK
        run: |
          IMAGE="openwrt/sdk:${{ matrix.sdk }}-${{ matrix.target }}"
          echo "Using SDK image: $IMAGE"
          docker run --rm -v "$PWD:/work" "$IMAGE" /bin/sh -c '
            set -e
            cd /builder
            cp -r /work/package/udp-broadcast-relay-redux package/
            make package/udp-broadcast-relay-redux/compile -j$(nproc) || make package/udp-broadcast-relay-redux/compile V=s
            find bin -name "udp-broadcast-relay-redux*" -exec cp {} /work/ \;
          '

      - name: Collect
        run: |
          mkdir -p artifacts
          for f in udp-broadcast-relay-redux*; do
            [ -f "$f" ] && mv "$f" "artifacts/${{ matrix.release }}-$(echo ${{ matrix.target }} | tr / -)-$f"
          done
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.release }}-${{ matrix.target }}
          path: artifacts/*

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
